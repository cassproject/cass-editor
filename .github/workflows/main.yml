name: github pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: gh-pages-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+ / 22.12+
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # docs build into public/docs, which the app build then copies to dist/docs.
      # DOCS_BASE matches the GitHub Pages project path this site is served under.
      - run: npm run docs:build
        env:
          DOCS_BASE: /cass-editor/docs/

      - run: npm run build

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
